name: Buddies App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0)'
        required: true
        default: '0.3.0'
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Tap to Buddy peer-to-peer media sharing, Rebranded to Buddies with ultra-smooth UI, Enhanced connectivity and stability improvements'
        type: string
      is_mandatory:
        description: 'Is mandatory update (true/false)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Stable Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          python3 -c "import base64, os, sys; raw = os.environ.get('KEYSTORE_B64', '').strip().encode('utf-8').decode('utf-8-sig').strip(); b = base64.b64decode(raw) if raw else sys.exit(1); open(os.path.expanduser('~/.android/debug.keystore'), 'wb').write(b); open('app/debug.keystore', 'wb').write(b)"
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Universal APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate Universal APK Output and Certificate
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-universal-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Universal APK not found at $APK_PATH!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "✅ Built APK verified. Size: $SIZE bytes"
          if [ "$SIZE" -lt 2097152 ]; then
            echo "❌ APK is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          echo "Verifying APK signing certificate..."
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          CERTS_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs -v "$APK_PATH")
          echo "$CERTS_OUTPUT"
          if ! echo "$CERTS_OUTPUT" | tr -d ':' | grep -iq "9c8d94948282d8655589bdd5af12d6441d1d0cfe"; then
            echo "❌ APK signing certificate does NOT match master release key (9c8d94948282d8655589bdd5af12d6441d1d0cfe)!"
            exit 1
          fi
          echo "✅ APK signed with verified master release key!"

      - name: Determine Release Tag and Name
        id: release_meta
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            INPUT_VER="${{ inputs.version }}"
            VER="${INPUT_VER#v}"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Buddies v${{ steps.release_meta.outputs.version }}
          body: ${{ inputs.release_notes || 'Buddies Android App Release - Tap to Buddy P2P Media Sharing & Performance Enhancements' }}
          files: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
