name: Buddies App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0)'
        required: true
        default: '0.3.0'
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Tap to Buddy peer-to-peer media sharing, Rebranded to Buddies with ultra-smooth UI, Enhanced connectivity and stability improvements'
        type: string
      is_mandatory:
        description: 'Is mandatory update (true/false)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Stable Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
            echo "✅ Successfully restored release keystore from GitHub secrets."
          else
            echo "❌ ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Universal APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate Universal APK Output and Certificate
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-universal-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Universal APK not found at $APK_PATH!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "✅ Built APK verified. Size: $SIZE bytes"
          if [ "$SIZE" -lt 10485760 ]; then
            echo "❌ APK is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          echo "Verifying APK signing certificate..."
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs -v "$APK_PATH"

      - name: Determine Release Tag and Name
        id: release_meta
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            INPUT_VER="${{ inputs.version }}"
            VER="${INPUT_VER#v}"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Buddies v${{ steps.release_meta.outputs.version }}
          body: ${{ inputs.release_notes || 'Buddies Android App Release - Tap to Buddy P2P Media Sharing & Performance Enhancements' }}
          files: app/build/outputs/apk/debug/app-universal-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
